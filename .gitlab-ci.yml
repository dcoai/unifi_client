# CI for unifi_client — the hard gate that keeps main green.
#
# Filed under #7: the suite sat 46/50 red for nine months because nothing
# ran it. Every push and merge request runs the same three checks the
# work-item skills require locally, plus the examples' --help path so a
# broken Mix.install line (which is exactly what #7 found) cannot land.
#
# Mirrors the sibling projects: group runner tagged DCOTek, pinned hexpm
# image so a toolchain bump is a deliberate commit.

variables:
  ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824-slim

default:
  tags:
    - DCOTek
  interruptible: true

stages:
  - check
  - test

.elixir:
  image: $ELIXIR_IMAGE
  variables:
    MIX_ENV: test
    MIX_INSTALL_DIR: $CI_PROJECT_DIR/.mix-install
  before_script:
    - mix local.hex --force
    - mix local.rebar --force
    - mix deps.get
  cache:
    key:
      files:
        - mix.lock
    paths:
      - deps
      - _build
      - .mix-install

format:
  extends: .elixir
  stage: check
  script:
    - mix format --check-formatted

compile:
  extends: .elixir
  stage: check
  script:
    - mix compile --force --warnings-as-errors

test:
  extends: .elixir
  stage: test
  script:
    - mix test

# Each example must at least start: Mix.install resolves the path dep and
# hex deps, the module compiles, and --help exits 0 without a console.
examples:
  extends: .elixir
  stage: test
  variables:
    MIX_ENV: dev
  script:
    - for f in examples/*.exs; do echo "== $f"; elixir "$f" --help > /dev/null; done
